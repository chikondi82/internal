<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="description" content="Secure VGF partner programme dashboard."/><title>Partner Portal | VGF</title><link rel="stylesheet" href="vgf-admin.css"/><link rel="stylesheet" href="vgf-portal.css"/><link rel="stylesheet" href="vgf-admin-extra.css"/><link rel="stylesheet" href="vgf-theme.css"/><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script></head>
<body><header class="topbar"><a class="brand" href="programmes.html"><img src="https://i.postimg.cc/TwZgn6YW/Vialifecoach-Global-Foundation-logo.jpg" alt=""/><span>Vialifecoach<small>Partner Portal</small></span></a><nav><a href="programmes.html">Public opportunities</a><button id="partner-signout" type="button" hidden>Sign out</button></nav></header><main><div id="partner-notice" class="notice" hidden role="status"></div>
<section id="partner-auth" class="panel portal-panel"><p class="eyebrow">APPROVED PARTNERS</p><h1>Partner sign in</h1><p class="muted">Access is limited to programmes assigned by VGF. Partner representatives must use the invitation email address.</p><form id="partner-login"><label>Email<input id="partner-email" type="email" required autocomplete="email"/></label><label>Password<input id="partner-password" type="password" required autocomplete="current-password"/></label><button class="primary" type="submit">Sign in</button></form></section>
<section id="partner-dashboard" class="panel portal-panel" hidden><div class="panel-title"><div><p class="eyebrow">ASSIGNED RECORDS ONLY · <span id="partner-org-name"></span></p><h1>Programme applications</h1></div><button id="partner-refresh" type="button" class="secondary">Refresh</button></div><div id="partner-applications"></div></section>
<section id="partner-rep-management" class="panel portal-panel" hidden><div class="panel-title"><div><p class="eyebrow">ORGANISATION ACCESS</p><h2>Representatives</h2></div><button id="partner-rep-refresh" type="button" class="secondary">Refresh</button></div><form id="partner-rep-form" class="partner-form"><label>Name<input id="partner-rep-name" maxlength="160" required /></label><label>Email<input id="partner-rep-email" type="email" maxlength="254" required /></label><label>Role<select id="partner-rep-role"><option value="partner_reviewer">Partner Reviewer</option><option value="partner_viewer">Partner Viewer</option></select></label><button class="primary" type="submit">Invite representative</button></form><div id="partner-representatives" class="record-list"></div></section>
</main><script src="firebase-init.js"></script><script src="vgf-partner.js"></script></body></html>
