<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Applicant Privacy Notice | VGF</title><link rel="stylesheet" href="vgf-admin.css"/><link rel="stylesheet" href="vgf-portal.css"/><link rel="stylesheet" href="vgf-theme.css"/><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script></head>
<body><header class="topbar"><a class="brand" href="programmes.html"><img src="https://i.postimg.cc/TwZgn6YW/Vialifecoach-Global-Foundation-logo.jpg" alt=""/><span>Vialifecoach<small>Privacy notice</small></span></a><nav><a href="programmes.html">Opportunities</a></nav></header><main><section class="panel portal-panel"><div class="panel-title"><div><p class="eyebrow">APPLICANT INFORMATION</p><h1>Privacy notice</h1></div><label class="language-picker">Language<select id="privacy-language"><option value="en">English</option><option value="fr">Français</option><option value="sw">Kiswahili</option><option value="rn">Kirundi</option><option value="rw">Kinyarwanda</option></select></label></div><div id="privacy-content" class="privacy-content">Loading the current VGF privacy notice…</div><h2>Data retention</h2><div id="retention-content" class="privacy-content"></div><p id="privacy-contact" class="muted"></p></section></main><script src="firebase-init.js"></script><script>
(function(){var root=document.getElementById('privacy-content');var retention=document.getElementById('retention-content');var select=document.getElementById('privacy-language');select.value=new URLSearchParams(location.search).get('language')||'en';function load(){fetch('/api/vgf/privacy?language='+encodeURIComponent(select.value)).then(function(r){return r.json().then(function(data){if(!r.ok)throw new Error(data.error||'Could not load the notice.');return data;});}).then(function(data){root.textContent=data.configured?data.privacyNotice:'VGF has not yet published this privacy notice in the selected language. Please contact the Foundation before submitting personal information.';retention.textContent=data.dataRetention||'';document.getElementById('privacy-contact').textContent=data.contactEmail?'Privacy contact: '+data.contactEmail:'';}).catch(function(error){root.textContent=error.message;});}select.addEventListener('change',function(){history.replaceState(null,'','?language='+encodeURIComponent(select.value));load();});load();}());
</script></body></html>
